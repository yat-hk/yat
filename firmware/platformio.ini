; YAT firmware — SeeedStudio reTerminal E1002 / E1001 (ESP32-S3, 32MB flash, 8MB OPI PSRAM)
;
;   pio run                     build the default env (e1002)
;   pio run -e e1001            build the mono model
;   pio run -e e1002 -t upload  flash over USB
;   pio device monitor          serial log @115200
;
; Two models, one carrier board. Everything below except the panel driver and
; the model define is shared, so it lives in [common] and each [env:*] extends
; it — the two envs cannot drift apart by someone editing one and forgetting
; the other. E1002 is the launch model and stays `default_envs`.
;
; The portable spec engine is pulled in as a local library from ../engine.

[platformio]
default_envs = e1002

; Shared by every model. NOT an [env:] section, so it is never built on its
; own; `extends` pulls it in. Note that `extends` overrides rather than merges,
; which is why each env below re-states build_flags as ${common.build_flags}
; plus its own two lines.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32s3
; Both modules use OPI PSRAM (Arduino IDE equivalent: Tools > PSRAM > OPI PSRAM)
board_build.arduino.memory_type = qio_opi

; 32MB flash. ota_0/ota_1 at 6MB each; the engine's bitmap font tables (~1.38MB
; of Noto Sans / Noto Sans TC rasterizations, engine/src/fonts_data_*.cpp) live
; inside the app image, so the stock 1.3MB app slot is far too small.
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions_ota_32mb.csv

; Teaches the build that WiFiManager.cpp depends on include/yat_wm_strings.h,
; which PlatformIO's scanner cannot see through the WM_STRINGS_FILE macro
; include. Without it, editing the portal's strings leaves a stale object and
; a SUCCESS build that still serves the old page.
extra_scripts =
    pre:wm_strings_dep.py
    pre:version_stamp.py

build_unflags =
    -std=gnu++2b
build_flags =
    -DBOARD_HAS_PSRAM
    ; the engine is C++17; the Arduino core defaults to gnu++2b
    -std=gnu++17
    ; drop WiFiManager's built-in "Available Pages" help table from the portal
    -DWM_NOHELP
    ; Swap WiFiManager's entire English strings header for YAT's bilingual,
    ; branded one. This is the library's own documented hook: WiFiManager.h does
    ; `#include WM_STRINGS_FILE` and never reads wm_strings_en.h once it is set.
    ; It is the only way to reach the post-save success page and the
    ; connect-failure lines, which have no setter. -Iinclude so the library's
    ; own translation unit can resolve the header out of the project.
    -DWM_STRINGS_FILE='"yat_wm_strings.h"'
    -Iinclude
    ; qrcodegen.h lives in the engine's third_party/ (not its includeDir), so
    ; render the provisioning screen's two QR codes with the same vendored
    ; encoder engine/src/render.cpp uses for the "qr" widget (ARCHITECTURE §8)
    -I../engine/third_party/qrcodegen
    ; s2t_table.h (simplified->traditional map) lives directly under
    ; third_party/ itself; the voice keyword matcher's normalizer reuses the
    ; same table engine/src/text.cpp's "s2t" filter does (PACK-SPEC §8.7/§2)
    -I../engine/third_party
    ; Where the device-served setup portal (include/portal_page.h) loads its
    ; real UI module from — the ~1 KB bootstrap the device serves is fixed at
    ; flash time, the UI it pulls in is not, so the portal can be changed
    ; without reflashing anyone's device. local dev server address — replace
    ; with your machine's LAN IP when developing the portal UI (production
    ; builds override this to the public site).
    ; A "?ui=" query param on the portal URL overrides this at runtime and
    ; sticks in localStorage, so this default only has to be right for a
    ; device nobody has redirected by hand.
    -DYAT_PORTAL_UI_BASE='"https://yat-day.pages.dev"'

monitor_speed = 115200
; 921600 fails on the carrier's USB-UART bridge ("chip stopped responding"),
; but 460800 is reliable (verified: stub upload + full 3 MB write) and ~4x
; faster than 115200 — a ~3 min browser/CLI flash drops to ~45 s.
upload_speed = 460800

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
    bblanchon/ArduinoJson@^7.4.2
    https://github.com/tanakamasayuki/efont.git
    kikuchan98/pngle@^1.1.0
    ; WiFi provisioning (ARCHITECTURE §8): captive portal + Improv-serial.
    ; Version/platform combo proven working on this exact board in
    ; the e1002-test prototype (private), src/wifidemo (platform-espressif32 55.03.39).
    tzapu/WiFiManager@^2.0.17
    https://github.com/jnthas/Improv-WiFi-Library.git#e37c244e0080349e191252acf4bce146eca118e0
    symlink://../engine

; ---------------------------------------------------------------------------
; reTerminal E1002 — 800x480 Spectra 6 (ED2208), the launch model.
[env:e1002]
extends = common
build_flags =
    ${common.build_flags}
    ; Selects Setup521_Seeed_reTerminal_E1002.h inside Seeed_GFX (ED2208,
    ; 800x480, 6-color). The combo number is also what makes Seeed_GFX define
    ; USE_COLORFULL_EPAPER, which turns TFT_BLACK/TFT_RED/... into raw 4bpp E6
    ; ink codes — see the INK table in src/yat_hw.h.
    -DBOARD_SCREEN_COMBO=521
    ; Picks yat::kProfileE1002 (Spectra6), the colour INK table, the
    ; "firmware-e1002.bin" OTA asset and the e1002 refresh budget. Exactly one
    ; YAT_MODEL_* is ever defined; src/yat_common.h resolves all four from it.
    -DYAT_MODEL_E1002

; ---------------------------------------------------------------------------
; reTerminal E1001 — the same 800x480 panel size and the same carrier board
; (identical CS/DC/BUSY/RST pin numbers; only the silkscreen names in the two
; Seeed_GFX setup headers differ), but a mono UC8179 panel instead of the E6.
[env:e1001]
extends = common
build_flags =
    ${common.build_flags}
    ; Selects Setup520_Seeed_reTerminal_E1001.h inside Seeed_GFX (UC8179,
    ; 800x480, black/white). USE_COLORFULL_EPAPER is NOT defined on this path,
    ; so the sprite is 1bpp and TFT_* revert to plain RGB565 values — again,
    ; see the INK table in src/yat_hw.h, which must not pass those through.
    -DBOARD_SCREEN_COMBO=520
    -DYAT_MODEL_E1001
